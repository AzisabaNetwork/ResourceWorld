---
name: Gradle
"on": [push]

jobs:
  build:
    name: Build with Java 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: java -version
      - run: ./gradlew --version
      - run: ./gradlew build
